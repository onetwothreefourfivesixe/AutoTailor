[project]
name = "autotailor"
version = "0.1.0"
description = "Local-first job matching and resume tailoring."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "langchain>=0.3",
    "langchain-anthropic>=0.3",
    "langchain-google-genai>=4.5.0",
    "langchain-ollama>=0.2",
    "langchain-openai>=1.8.0",
    "langgraph>=0.2",
    "pydantic>=2.7",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0",
    "tomli-w>=1.0",
    "typer>=0.12",
]

[project.scripts]
autotailor = "autotailor.cli:app"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autotailor"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
link-mode = "copy"
