[project]
name = "autotailor"
version = "0.1.0"
description = "Local-first job matching and resume tailoring."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiosmtpd>=1.4.6",
    "docxtpl>=0.20.2",
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "keyring>=25.7.0",
    "langchain>=0.3",
    "langchain-anthropic>=0.3",
    "langchain-google-genai>=4.5.0",
    "langchain-ollama>=0.2",
    "langchain-openai>=1.8.0",
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "numpy>=2.4.6",
    "pydantic>=2.7",
    "pypdf>=7.1.1",
    "pypdfium2>=5.15.2",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.34",
    "pyyaml>=6.0",
    "streamlit>=1.67.0",
    "tomli-w>=1.0",
    "typer>=0.12",
    "typst>=0.15.2",
]

[project.scripts]
autotailor = "autotailor.cli:app"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autotailor"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
link-mode = "copy"
